name: TechCheck Shopify Batch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/techcheck-shopify-batch.yml

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: techcheck-shopify-batch-20260901
      - name: Resume TechCheck batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_JOB_ID: '99902148990'
        run: node techcheck-resume.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techcheck-results
          path: techcheck-results.json
          if-no-files-found: error
