name: TechCheck Shopify Batch

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/techcheck-shopify-batch.yml

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: techcheck-shopify-batch-20260901
      - name: Retry unresolved TechCheck domains
        run: node techcheck-final-retry.mjs
      - name: Upload retry results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techcheck-final-retry
          path: techcheck-final-retry.json
          if-no-files-found: error
